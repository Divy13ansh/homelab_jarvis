# ALSA user-space config baked into the image.
# `spy` taps spotifyd's output to /cache/cap.wav while forwarding to hw:0,0.
# Used for diagnosing silent-output faults (proves whether the daemon emits
# audio or zeros). Not the default device — see SPOTIFYD_ALSA_DEVICE.
pcm.spy {
  type file
  file "/cache/cap.wav"
  format "wav"
  slave { pcm "hw:0,0" }
}
