services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest-browser}
    image: jarvis:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      JARVIS_ENV: ${JARVIS_ENV:-production}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./data/workspace:/workspace
      - ./data/projects:/data/projects
      - ./data/documents:/data/documents
      - ./data/logs:/data/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./voice:/app/voice:ro
      - ./skills:/home/node/.openclaw/skills:ro
      - ./skills:/workspace/skills:ro
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    group_add:
      - "987"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN

  spotifyd:
    build:
      context: ./spotifyd
      dockerfile: Dockerfile
      args:
        SPOTIFYD_VERSION: ${SPOTIFYD_VERSION:-0.4.2}
    image: jarvis-spotifyd:local
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "29"
    environment:
      SPOTIFYD_DEVICE_NAME: ${SPOTIFYD_DEVICE_NAME:-jarvis-server}
      SPOTIFYD_ALSA_DEVICE: ${SPOTIFYD_ALSA_DEVICE:-default}
      SPOTIFYD_MIXER: ${SPOTIFYD_MIXER:-Master}
      SPOTIFYD_INITIAL_VOLUME: ${SPOTIFYD_INITIAL_VOLUME:-80}
      SPOTIFYD_USERNAME: ${SPOTIFYD_USERNAME:-}
      SPOTIFYD_PASSWORD: ${SPOTIFYD_PASSWORD:-}
    volumes:
      - spotifyd-cache:/cache

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host
    profiles: [selfhosted]

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    profiles: [selfhosted]

volumes:
  openclaw-data:
  spotifyd-cache:
